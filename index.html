<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>퇴고</title>
<style>

body.a4 .scene{font-size:15pt;margin:0 0 2.1em;font-weight:800}
body.a4 .block{margin-bottom:.72em}
body.a4 .dialogue{grid-template-columns:24mm minmax(0,1fr);gap:6mm;margin-bottom:.58em}
body.a4 .char{text-align:left;font-weight:700}body.a4 #wrap{background:#ccc6bc}body.focus #top,body.focus #bottom,body.focus .side{display:none!important}body.focus #app{grid-template-rows:1fr}body.focus .work{grid-template-columns:1fr}.mobile{display:none}#focusExit{display:none;position:fixed;z-index:120;top:max(10px,env(safe-area-inset-top));right:10px;width:44px;height:44px;border:1px solid #cfc7ba;border-radius:50%;background:rgba(248,245,238,.9);font-size:24px;line-height:1}body.focus #focusExit{display:block}
@media(max-width:900px){.desktop{display:none}.mobile{display:inline-block}.work{display:block;position:relative}.side{display:none;position:absolute;z-index:50;top:0;bottom:0;width:min(88vw,360px);box-shadow:0 0 30px #0003}.side.open{display:block}.left{left:0}.right{right:0}#reader{padding:25px 18px 100px}.dialogue{grid-template-columns:78px minmax(0,1fr);gap:16px}#top{padding:6px}.btn{min-height:42px}body.a4 #reader{margin:0;box-shadow:none}}
</style></head><body><div id="app"><div id="top"><button class="btn" id="open">＋</button><button class="btn mobile" id="scenes">☰</button><div id="title"></div><button class="btn" id="minus">A−</button><button class="btn" id="plus">A＋</button><button class="btn" id="mode">A4</button><button class="btn mobile" id="marks">●</button><button class="btn" id="set">⚙</button><button class="btn" id="focus">⛶</button></div><button id="focusExit" title="집중 읽기 종료">×</button><div class="work"><aside class="side left" id="left"><h3>SCENE</h3><div id="sceneList"></div></aside><main id="wrap"><div class="empty" id="empty"><button class="btn" id="emptyOpen">HTML 열기</button></div><article id="reader" hidden></article></main><aside class="side right" id="right"><h3>MARK</h3><div class="filters" id="filters"></div><div id="review"></div></aside></div><div id="bottom"><input id="scrub" type="range" min="0" max="1000"><span id="pos">0%</span></div></div><div id="selbar"></div><div id="back"><div class="modal" id="modal"></div></div><input id="file" type="file" accept=".html,.htm" hidden><input id="json" type="file" accept=".json" hidden>
<script>
const DB='revision-local-v1',VER=1,DV=1,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>crypto.randomUUID?crypto.randomUUID():'x'+Date.now()+Math.random();
const H=[['minor','약수정','#f3df78'],['major','강수정','#e58f86'],['dialogue','대사','#8db8dc'],['add','추가','#b9a0d8'],['delete','삭제','#b9b9b5'],['check','확인','#9fc89b']].map(x=>({id:x[0],name:x[1],color:x[2]}));
const S=[['ok','OK','#5e8b68'],['keep','KEEP','#557da3'],['ng','NG','#ad5c55']].map(x=>({id:x[0],name:x[1],color:x[2]}));
let db,p=null,cfg=null,filter='all',selInfo=null;
function odb(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function kv(k,v,del=false){return new Promise((ok,no)=>{let t=db.transaction('kv',v!==undefined||del?'readwrite':'readonly').objectStore('kv'),r=del?t.delete(k):v===undefined?t.get(k):t.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const save=()=>p&&kv('project',p),saveCfg=()=>kv('settings',cfg);
function parse(txt,name){let d=new DOMParser().parseFromString(txt,'text/html'),blocks=[],sn=0;[...d.body.querySelectorAll('p')].forEach(q=>{let raw=(q.textContent||'').replace(/\u00a0/g,' ').trimEnd();if(!raw.trim())return;let tab=q.querySelector('.Scrivener-tab-span'),type='action',ch='',text=raw.trim();if(tab||/\bps3\b/.test(q.className||'')){type='dialogue';let z=(q.textContent||'').replace(/\u00a0/g,' ').split(/\t|\s{3,}/);if(z.length>1){ch=z.shift().trim();text=z.join(' ').trim()}else{ch=(tab?.previousSibling?.textContent||'').trim();text=raw.replace(ch,'').trim()}}else if(/^#\s*\d+|^#\d+/.test(text)||(q.querySelector('strong')&&/^#?\s*\d+[\.\s]/.test(text))){type='scene';sn++}blocks.push({id:'b'+blocks.length,type,text,character:ch,sceneIndex:sn})});return{dataVersion:DV,id:uid(),name:name.replace(/\.html?$/i,''),blocks,annotations:[],stamps:{},scroll:0}}
function render(){document.documentElement.style.setProperty('--size',cfg.size+'px');document.documentElement.style.setProperty('--lh',cfg.lh);$('#title').textContent=p?.name||'';if(!p){$('#reader').hidden=true;$('#reader').innerHTML='';$('#empty').style.display='flex';$('#sceneList').innerHTML='';$('#review').innerHTML='';$('#title').textContent='';return}$('#empty').style.display='none';$('#reader').hidden=false;$('#reader').innerHTML='';for(let b of p.blocks){let e=document.createElement(b.type==='scene'?'section':'p');e.className='block '+b.type;e.dataset.bid=b.id;if(b.type==='dialogue'){let a=document.createElement('span');a.className='char';a.textContent=b.character;let z=document.createElement('span');textRender(z,b);e.append(a,z)}else textRender(e,b);if(b.type==='scene'){let sid=p.stamps[b.id],st=cfg.stamps.find(x=>x.id===sid),x=document.createElement('button');x.className=st?'stamp':'stamp stampAdd';x.textContent=st?st.name:'＋';x.style.color=st?st.color:'#8a8378';x.title=st?'도장 변경':'도장';x.onclick=ev=>{ev.stopPropagation();stamp(b.id)};e.append(x)}$('#reader').append(e)}nav();filters();review();requestAnimationFrame(()=>{$('#wrap').scrollTop=p.scroll||0;position()})}
function textRender(e,b){let ms=p.annotations.filter(x=>x.blockId===b.id&&x.end>x.start).sort((a,z)=>a.start-z.start),pts=[0,b.text.length];ms.forEach(x=>pts.push(x.start,x.end));pts=[...new Set(pts)].sort((a,z)=>a-z);for(let i=0;i<pts.length-1;i++){let a=pts[i],z=pts[i+1],t=b.text.slice(a,z),act=ms.filter(x=>x.start<=a&&x.end>=z).at(-1);if(!act)e.append(document.createTextNode(t));else{let w=document.createElement(act.kind==='hl'?'mark':'span');if(act.kind==='memo')w.className='memo';else w.style.background=cfg.highlighters.find(x=>x.id===act.preset)?.color||'#eee';w.textContent=t;w.onclick=ev=>{ev.stopPropagation();editMark(act.id)};e.append(w)}}ms.filter(x=>x.kind==='memo').forEach(m=>{let d=document.createElement('span');d.className='dot';d.textContent='•';d.onclick=()=>editMark(m.id);e.append(d)})}
function nav(){$('#sceneList').innerHTML=p.blocks.filter(x=>x.type==='scene').map(b=>{let s=cfg.stamps.find(x=>x.id===p.stamps[b.id]);return`<button class="item" data-go="${b.id}">${esc(b.text)} ${s?'['+esc(s.name)+']':''}</button>`}).join('');$$('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}
function filters(){let a=[['all','전체'],...cfg.highlighters.map(x=>['h:'+x.id,x.name]),['memo','메모'],['stamp','도장']];$('#filters').innerHTML=a.map(x=>`<button class="btn ${filter===x[0]?'on':''}" data-f="${x[0]}">${esc(x[1])}</button>`).join('');$$('[data-f]').forEach(x=>x.onclick=()=>{filter=x.dataset.f;filters();review()})}
function review(){let a=[];p.annotations.forEach(m=>{if(filter==='all'||filter==='memo'&&m.kind==='memo'||filter==='h:'+m.preset){let b=p.blocks.find(x=>x.id===m.blockId);if(b)a.push([b.id,m.kind==='memo'?'메모':cfg.highlighters.find(x=>x.id===m.preset)?.name,m.note||b.text.slice(m.start,m.end)])}});if(filter==='all'||filter==='stamp')Object.entries(p.stamps).forEach(([id,sid])=>{let b=p.blocks.find(x=>x.id===id),s=cfg.stamps.find(x=>x.id===sid);if(b&&s)a.push([id,s.name,b.text])});$('#review').innerHTML=a.map(x=>`<button class="item" data-r="${x[0]}"><b>${esc(x[1]||'')}</b><div class="small">${esc((x[2]||'').slice(0,100))}</div></button>`).join('');$$('[data-r]').forEach(x=>x.onclick=()=>go(x.dataset.r))}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(id){document.querySelector(`[data-bid="${CSS.escape(id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});$$('.side').forEach(x=>x.classList.remove('open'))}
function offset(b,node,o){let root=document.querySelector(`[data-bid="${b.id}"]`),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,total=0;while(n=w.nextNode()){if(n===node)return total+o;total+=(n.textContent||'').length}return null}
document.addEventListener('selectionchange',()=>{clearTimeout(window.st);window.st=setTimeout(()=>{let s=getSelection();if(!s||s.isCollapsed||!p){$('#selbar').style.display='none';return}let a=s.anchorNode?.parentElement?.closest('[data-bid]'),f=s.focusNode?.parentElement?.closest('[data-bid]');if(!a||!f||a!==f)return;let b=p.blocks.find(x=>x.id===a.dataset.bid);if(!b||b.type==='scene')return;let x=offset(b,s.anchorNode,s.anchorOffset),y=offset(b,s.focusNode,s.focusOffset);if(x>y)[x,y]=[y,x];selInfo={blockId:b.id,start:x,end:y};let bar=$('#selbar');bar.innerHTML=cfg.highlighters.map(h=>`<button class="colorbtn" style="background:${h.color}" data-h="${h.id}">${esc(h.name)}</button>`).join('')+'<button class="btn" id="memoAdd">메모</button>';bar.style.display='flex';let r=s.getRangeAt(0).getBoundingClientRect();bar.style.left=Math.max(6,Math.min(innerWidth-500,r.left))+'px';bar.style.top=Math.max(6,r.top-55)+'px';$$('[data-h]').forEach(q=>q.onclick=async()=>{p.annotations.push({id:uid(),kind:'hl',preset:q.dataset.h,...selInfo,note:''});s.removeAllRanges();bar.style.display='none';await save();render()});$('#memoAdd').onclick=()=>memoNew()},100)});
function modal(x){$('#modal').innerHTML=x;$('#back').style.display='flex';$$('[data-close]').forEach(x=>x.onclick=close)}function close(){$('#back').style.display='none'}$('#back').onclick=e=>{if(e.target===$('#back'))close()}
function memoNew(){modal('<h2>메모</h2><textarea id="mt"></textarea><div class="row end"><button class="btn" data-close>취소</button><button class="btn" id="ms">추가</button></div>');$('#ms').onclick=async()=>{let t=$('#mt').value.trim();if(t)p.annotations.push({id:uid(),kind:'memo',...selInfo,note:t});await save();close();render()}}
function editMark(id){let m=p.annotations.find(x=>x.id===id);modal(`<h2>${m.kind==='memo'?'메모':'표시'}</h2>${m.kind==='hl'?`<select id="pc">${cfg.highlighters.map(h=>`<option value="${h.id}" ${h.id===m.preset?'selected':''}>${esc(h.name)}</option>`).join('')}</select>`:''}<textarea id="mn">${esc(m.note||'')}</textarea><div class="row end"><button class="btn danger" id="md">삭제</button><button class="btn" data-close>취소</button><button class="btn" id="mv">저장</button></div>`);$('#md').onclick=async()=>{p.annotations=p.annotations.filter(x=>x.id!==id);await save();close();render()};$('#mv').onclick=async()=>{m.note=$('#mn').value.trim();if(m.kind==='hl')m.preset=$('#pc').value;await save();close();render()}}
function stamp(id){modal(`<h2>도장</h2><div class="row">${cfg.stamps.map(s=>`<button class="btn" data-s="${s.id}" style="color:${s.color};font-weight:800">${esc(s.name)}</button>`).join('')}</div><div class="row end"><button class="btn danger" id="sd">삭제</button><button class="btn" data-close>닫기</button></div>`);$$('[data-s]').forEach(x=>x.onclick=async()=>{p.stamps[id]=x.dataset.s;await save();close();render()});$('#sd').onclick=async()=>{delete p.stamps[id];await save();close();render()}}
function settings(){modal(`<h2>설정</h2><div class="small">형광펜</div><div id="hs"></div><button class="btn" id="ha">＋ 형광펜</button><div class="sep"></div><div class="small">도장</div><div id="ss"></div><button class="btn" id="sa">＋ 도장</button><div class="sep"></div><div class="row"><button class="btn" id="pe">프리셋 백업</button><button class="btn" id="pi">프리셋 복원</button><button class="btn" id="je">퇴고 JSON</button><button class="btn" id="ji">퇴고 복원</button></div>${p?'<div class="sep"></div><button class="btn danger" id="wipe">현재 원고 완전 삭제</button>':''}<div class="row end"><button class="btn" id="done">닫기</button></div>`);presetDraw();$('#ha').onclick=()=>{cfg.highlighters.push({id:uid(),name:'새 표시',color:'#eadf9b'});presetDraw()};$('#sa').onclick=()=>{cfg.stamps.push({id:uid(),name:'NEW',color:'#777777'});presetDraw()};$('#done').onclick=async()=>{await saveCfg();close();render()};$('#pe').onclick=()=>down({app:'revision-presets',dataVersion:DV,highlighters:cfg.highlighters,stamps:cfg.stamps},'퇴고-프리셋.json');$('#pi').onclick=()=>{$('#json').dataset.mode='preset';$('#json').click()};$('#je').onclick=()=>exportReview();$('#ji').onclick=()=>{$('#json').dataset.mode='project';$('#json').click()};if($('#wipe'))$('#wipe').onclick=async()=>{if(confirm('현재 원고와 모든 퇴고 표시를 이 기기에서 완전히 삭제할까요?')&&confirm('이 앱에서는 복구할 수 없습니다. 삭제할까요?')){await kv('project',undefined,true);p=null;selInfo=null;getSelection()?.removeAllRanges();$('#selbar').style.display='none';close();render()}}}
function presetDraw(){$('#hs').innerHTML=cfg.highlighters.map((h,i)=>`<div class="preset"><input type="color" value="${h.color}" data-hc="${i}"><input type="text" value="${esc(h.name)}" data-hn="${i}"><button class="btn" data-hd="${i}">×</button></div>`).join('');$('#ss').innerHTML=cfg.stamps.map((s,i)=>`<div class="preset"><input type="color" value="${s.color}" data-sc="${i}"><input type="text" value="${esc(s.name)}" data-sn="${i}"><button class="btn" data-sd="${i}">×</button></div>`).join('');$$('[data-hc]').forEach(x=>x.oninput=()=>cfg.highlighters[+x.dataset.hc].color=x.value);$$('[data-hn]').forEach(x=>x.oninput=()=>cfg.highlighters[+x.dataset.hn].name=x.value);$$('[data-sc]').forEach(x=>x.oninput=()=>cfg.stamps[+x.dataset.sc].color=x.value);$$('[data-sn]').forEach(x=>x.oninput=()=>cfg.stamps[+x.dataset.sn].name=x.value);$$('[data-hd]').forEach(x=>x.onclick=()=>{if(cfg.highlighters.length>1){cfg.highlighters.splice(+x.dataset.hd,1);presetDraw()}});$$('[data-sd]').forEach(x=>x.onclick=()=>{if(cfg.stamps.length>1){cfg.stamps.splice(+x.dataset.sd,1);presetDraw()}})}

function docSignature(){if(!p)return null;let t=p.blocks.map(b=>[b.type,b.character||'',b.text].join('|')).join('\n');let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function exportReview(){if(!p)return;down({app:'revision-review',dataVersion:DV,sourceName:p.name,documentSignature:docSignature(),annotations:p.annotations,stamps:p.stamps},(p.name||'원고')+'-퇴고.json')}
async function importReview(j){if(!p){alert('먼저 원본 HTML을 열어 주세요.');return}if(!Array.isArray(j.annotations)||!j.stamps){alert('퇴고 JSON 형식이 아닙니다.');return}if(j.documentSignature&&j.documentSignature!==docSignature()&&!confirm('현재 HTML과 다른 원고에서 만든 퇴고 JSON일 수 있습니다. 그래도 불러올까요?'))return;p.annotations=j.annotations;p.stamps=j.stamps;await save();render()}

function down(o,n){let u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
$('#json').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(e.target.dataset.mode==='preset'){cfg.highlighters=j.highlighters||cfg.highlighters;cfg.stamps=j.stamps||cfg.stamps;await saveCfg()}else{await importReview(j)}close();render()}catch{alert('JSON을 읽을 수 없습니다.')}e.target.value=''}
async function loadHtml(f){let np=parse(await f.text(),f.name);if(p&&!confirm('현재 원고를 새 원고로 바꿀까요?'))return;p=np;await save();render()}$('#file').onchange=e=>{if(e.target.files[0])loadHtml(e.target.files[0]);e.target.value=''}
$('#open').onclick=$('#emptyOpen').onclick=()=>$('#file').click();$('#set').onclick=settings;$('#minus').onclick=async()=>{cfg.size=Math.max(13,cfg.size-1);await saveCfg();render()};$('#plus').onclick=async()=>{cfg.size=Math.min(32,cfg.size+1);await saveCfg();render()};$('#mode').onclick=()=>{document.body.classList.toggle('a4');$('#mode').textContent=document.body.classList.contains('a4')?'읽기':'A4'};$('#focus').onclick=()=>document.body.classList.toggle('focus');$('#focusExit').onclick=()=>document.body.classList.remove('focus');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('focus')});$('#scenes').onclick=()=>{$('#right').classList.remove('open');$('#left').classList.toggle('open')};$('#marks').onclick=()=>{$('#left').classList.remove('open');$('#right').classList.toggle('open')};
